<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería | Apple Style</title>
    <style>
        :root {
            color-scheme: light;
            --text: #1d1d1f;
            --muted: #6e6e73;
            --surface: #ffffff;
            --background: #f5f5f7;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background: var(--background);
        }

        .contenedor {
            width: min(1180px, calc(100% - 40px));
            margin: 0 auto;
            padding: 72px 0 80px;
        }

        .encabezado { text-align: center; margin-bottom: 42px; }
        .encabezado p { color: var(--muted); font-size: 1.1rem; margin: 12px 0 0; }
        h1 { font-size: clamp(2.5rem, 6vw, 4.8rem); letter-spacing: -0.06em; margin: 0; }

        .galeria {
            display: flex;
            flex-wrap: wrap;
            gap: 22px;
        }

        .tarjeta {
            flex: 1 1 300px;
            overflow: hidden;
            background: var(--surface);
            border-radius: 24px;
            box-shadow: 0 8px 30px rgb(0 0 0 / 8%);
            transition: transform .3s ease, box-shadow .3s ease;
        }

        .tarjeta:hover {
            transform: translateY(-8px);
            box-shadow: 0 18px 38px rgb(0 0 0 / 14%);
        }

        .tarjeta img { display: block; width: 100%; height: 270px; object-fit: cover; }
        .contenido { padding: 22px 24px 25px; }
        h2 { font-size: 1.35rem; margin: 0 0 8px; letter-spacing: -0.02em; }
        .contenido p { color: var(--muted); line-height: 1.5; margin: 0; }

        @media (max-width: 600px) {
            .contenedor { padding-top: 48px; }
            .tarjeta { flex-basis: 100%; }
        }
    </style>
</head>
<body>
   <main class="contenedor">
        <header class="encabezado">
            <h1>Explora lo extraordinario.</h1>
            <p>Una colección de momentos, diseñada para inspirar.</p>
        </header>

        <section class="galeria" aria-label="Galería de imágenes">
            <article class="tarjeta">
                <img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=900&q=85" alt="Montañas bajo un cielo estrellado">
                <div class="contenido"><h2>Naturaleza</h2><p>La belleza de lo esencial.</p></div>
            </article>
            <article class="tarjeta">
                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=85" alt="Lago rodeado de montañas verdes">
                <div class="contenido"><h2>Perspectiva</h2><p>Encuentra una nueva forma de mirar.</p></div>
            </article>
            <article class="tarjeta">
                <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=85" alt="Playa con palmeras al atardecer">
                <div class="contenido"><h2>Libertad</h2><p>Vive cada instante al máximo.</p></div>
            </article>
        </section>
    </main>
</body>
</html>
