    <style>
        :root {
            --vino-principal: #5a121e;
            --vino-obscuro: #380a13;
            --rosa-soft: #f4c2c2;
            --rosa-claro: #fdf5f6;
            --amarillo-pastel: #fef08a;
            --crema-bg: #faf7f5;
            --blanco: #ffffff;
            --radius: 20px; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--crema-bg);
            color: var(--vino-obscuro);
            line-height: 1.6;
        }

        /* PORTADA */
        .hero {
            position: relative;
            width: 100%;
            padding: 70px 20px 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(135deg, var(--vino-obscuro) 0%, var(--vino-principal) 100%);
            color: var(--blanco);
        }

        .hero-content {
            max-width: 700px;
        }

        .hero-badge {
            display: inline-block;
            background-color: var(--amarillo-pastel);
            color: var(--vino-obscuro);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            padding: 6px 18px;
            border-radius: 50px;
            margin-bottom: 16px;
        }

        .hero-title span {
            color: var(--rosa-soft);
            font-style: italic;
            font-weight: 400;
        }

        .hero-subtitle {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 300;
        }

        /* GALERÍA */
        .contenedor {
            width: min(1100px, calc(100% - 32px));
            margin: 0 auto;
            padding: 40px 0 70px;
        }

        .galeria-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

   .card {
            background-color: var(--blanco);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(56, 10, 19, 0.06);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            border: 1px solid rgba(244, 194, 194, 0.3);
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 32px rgba(56, 10, 19, 0.12);
        }

        .card-img-wrapper {
            position: relative;
            width: 100%;
            padding-top: 130%;
            overflow: hidden;
            background-color: var(--rosa-claro);
        }

        .card:hover .card-img-wrapper img {
            transform: scale(1.04);
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            background-color: var(--vino-obscuro);
            color: var(--rosa-soft);
            font-size: 0.85rem;
            font-weight: 300;
        }

        @media (max-width: 600px) {
            .hero-title { font-size: 2.4rem; }
            .galeria-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .contenedor { padding: 24px 0 50px; }
        }
    </style>
</head>
